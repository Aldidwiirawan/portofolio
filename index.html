<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Supabase: data requests (CORS) and images use separate connections; both open while the app loads -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portofolio Aldi Dwi Irawan, Junior Programmer · Web &amp; Mobile: proyek, keahlian, pengalaman, dan kontak." />
    <title>Aldi Dwi Irawan · Portofolio</title>
    <!-- Browser bar color of login and admin (follows the device, data-default = value to restore). On
         public pages the script below and ThemeProvider set it to the page background of the theme. -->
    <meta name="theme-color" content="#f6f8fb" data-default="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0d14" data-default="#0a0d14" media="(prefers-color-scheme: dark)" />
    <!-- Link previews (WhatsApp, LinkedIn, X) read these without running JavaScript: one site-wide title,
         text and image for every address (K11). og:image / twitter:image come from vite.config.js
         (absolute address); the app keeps description, og:*, canonical and robots current per page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aldi Dwi Irawan" />
    <meta property="og:title" content="Aldi Dwi Irawan · Portofolio" />
    <meta property="og:description" content="Portofolio Aldi Dwi Irawan, Junior Programmer · Web &amp; Mobile: proyek, keahlian, pengalaman, dan kontak." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aldi Dwi Irawan, Junior Programmer · Web &amp; Mobile" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:title" content="Aldi Dwi Irawan · Portofolio" />
    <meta name="twitter:description" content="Portofolio Aldi Dwi Irawan, Junior Programmer · Web &amp; Mobile: proyek, keahlian, pengalaman, dan kontak." />
    <script>
      // 1. Preloads the font of the largest text: Inter on login and admin, Space Grotesk on public pages
      //    (file addresses come from the meta tags vite.config.js adds at build time).
      // 2. Public pages only: applies the saved theme (light when none is saved) and language before the
      //    first render, so the page does not flash in the wrong theme. Login and admin (/admin…) keep
      //    their own theme. Keys: THEME_STORAGE_KEY (ThemeProvider.jsx), LANGUAGE_STORAGE_KEY (I18nProvider.jsx).
      (function () {
        var admin = /^\/admin(\/|$)/.test(location.pathname)
        var font = document.querySelector(admin ? 'meta[name="font-preload-admin"]' : 'meta[name="font-preload-public"]')
        if (font) {
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'font'
          link.type = 'font/woff2'
          link.crossOrigin = ''
          link.href = font.content
          document.head.appendChild(link)
        }
        if (admin) return
        var root = document.documentElement
        var theme = null
        var lang = null
        try {
          theme = localStorage.getItem('aldi-portfolio-theme')
          lang = localStorage.getItem('aldi-portfolio-lang')
        } catch (e) {}
        if (theme !== 'dark') theme = 'light'
        root.setAttribute('data-pub-theme', theme)
        var bars = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < bars.length; i++) bars[i].setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#ffffff')
        if (lang === 'en') root.lang = 'en'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
