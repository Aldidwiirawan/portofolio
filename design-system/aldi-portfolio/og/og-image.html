<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>OG image</title>
<!--
  Sumber gambar pratinjau tautan public/og-image.png (1200 × 630), tahap 3C.
  Cara membuat ulang (misalnya setelah nama atau peran berubah): ubah teks di bawah, buka file ini di
  Chrome, buka DevTools → Toggle device toolbar → ukuran 1200 × 630 (DPR 1), lalu menu ⋮ →
  "Capture screenshot", simpan sebagai public/og-image.png.
-->
<style>
  @font-face {
    font-family: 'Inter Variable';
    src: url('../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'JetBrains Mono Variable';
    src: url('../../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 800;
  }
  :root {
    --canvas: #0a0d14;
    --surface: #111625;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --soft: #cbd5e1;
    --accent: #60a5fa;
    --line: rgba(241, 245, 249, 0.05);
    --line-major: rgba(241, 245, 249, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--canvas); }
  body {
    position: relative;
    font-family: 'Inter Variable', sans-serif;
    color: var(--text);
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--line-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-major) 1px, transparent 1px),
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px, 64px 64px, 16px 16px, 16px 16px;
    background-position: -1px -1px;
    mask-image: radial-gradient(ellipse at 40% 45%, #000 35%, transparent 85%);
  }
  .traces { position: absolute; inset: 0; color: rgba(96, 165, 250, 0.22); }
  .frame {
    position: absolute;
    inset: 40px;
    --b: rgba(96, 165, 250, 0.75);
    background:
      linear-gradient(var(--b), var(--b)) top left / 28px 2px,
      linear-gradient(var(--b), var(--b)) top left / 2px 28px,
      linear-gradient(var(--b), var(--b)) top right / 28px 2px,
      linear-gradient(var(--b), var(--b)) top right / 2px 28px,
      linear-gradient(var(--b), var(--b)) bottom left / 28px 2px,
      linear-gradient(var(--b), var(--b)) bottom left / 2px 28px,
      linear-gradient(var(--b), var(--b)) bottom right / 28px 2px,
      linear-gradient(var(--b), var(--b)) bottom right / 2px 28px;
    background-repeat: no-repeat;
  }
  .content { position: absolute; left: 88px; top: 104px; width: 700px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 52px; height: 52px; color: var(--accent); }
  .brand span { font-family: 'JetBrains Mono Variable', monospace; font-size: 20px; font-weight: 600; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
  .tag {
    display: inline-flex;
    margin-top: 64px;
    padding: 6px 12px;
    --b: var(--accent);
    background:
      linear-gradient(var(--b), var(--b)) top left / 9px 2px,
      linear-gradient(var(--b), var(--b)) top left / 2px 9px,
      linear-gradient(var(--b), var(--b)) top right / 9px 2px,
      linear-gradient(var(--b), var(--b)) top right / 2px 9px,
      linear-gradient(var(--b), var(--b)) bottom left / 9px 2px,
      linear-gradient(var(--b), var(--b)) bottom left / 2px 9px,
      linear-gradient(var(--b), var(--b)) bottom right / 9px 2px,
      linear-gradient(var(--b), var(--b)) bottom right / 2px 9px;
    background-repeat: no-repeat;
    color: var(--accent);
    font-family: 'JetBrains Mono Variable', monospace;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.12em;
  }
  h1 {
    margin-top: 22px;
    font-size: 104px;
    font-weight: 850;
    line-height: 0.92;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }
  .role { margin-top: 28px; font-size: 38px; font-weight: 600; letter-spacing: -0.01em; color: var(--soft); }
  .url { position: absolute; left: 88px; bottom: 76px; font-family: 'JetBrains Mono Variable', monospace; font-size: 22px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
  .url b { color: var(--accent); font-weight: 600; }
  .pile { position: absolute; right: 92px; bottom: 120px; width: 300px; height: 330px; }
  .label {
    position: absolute;
    display: inline-flex;
    align-items: center;
    height: 54px;
    padding: 0 22px;
    border: 1px solid rgba(203, 213, 225, 0.35);
    background: var(--surface);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    font-family: 'JetBrains Mono Variable', monospace;
    font-size: 22px;
    font-weight: 600;
    white-space: nowrap;
  }
  .label::before {
    content: '';
    position: absolute;
    inset: 4px;
    --b: var(--accent);
    background:
      linear-gradient(var(--b), var(--b)) top left / 7px 2px,
      linear-gradient(var(--b), var(--b)) top left / 2px 7px,
      linear-gradient(var(--b), var(--b)) bottom right / 7px 2px,
      linear-gradient(var(--b), var(--b)) bottom right / 2px 7px;
    background-repeat: no-repeat;
  }
  .orb {
    position: absolute;
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    background: #0f1f3d;
    color: var(--accent);
    font-family: 'JetBrains Mono Variable', monospace;
    font-size: 28px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <svg class="traces" width="1200" height="630" aria-hidden="true">
    <defs>
      <pattern id="t" width="512" height="512" patternUnits="userSpaceOnUse" x="-120" y="-60">
        <path d="M32.5 80.5H144.5V176.5H240.5M304.5 48.5V128.5H432.5V208.5M80.5 304.5H176.5V432.5H272.5M368.5 288.5V368.5H480.5M224.5 336.5V400.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M32.5 80.5h0M240.5 176.5h0M304.5 48.5h0M432.5 208.5h0M80.5 304.5h0M272.5 432.5h0M368.5 288.5h0M480.5 368.5h0M224.5 336.5h0M224.5 400.5h0" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
      </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#t)" />
  </svg>
  <div class="frame"></div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 512 512" aria-hidden="true"><g fill="currentColor">
        <path d="M24 24H172L121.5 96H24Z"/><path d="M40 128H104V416H120V488H24V416H40Z"/>
        <path d="M204 24H274L190 144H232V128H250L286 200H152L120 245.5V144Z"/><path d="M283 34L392 252V280H328V252L245.5 87.5Z"/>
        <path d="M157 216H200V416H392V488H136V245.5Z"/><path d="M294 24H488V112A80 80 0 0 0 440 96H330Z"/>
        <path d="M346 128H440A48 48 0 0 1 488 176V328A56 56 0 0 1 432 384H232V216H296V312H424V200H382Z"/>
        <path d="M424 415.5A88 88 0 0 0 488 396V488H424Z"/>
      </g></svg>
      <span>Portofolio</span>
    </div>
    <p class="tag">SIAP BEKERJA</p>
    <h1>Aldi Dwi<br />Irawan</h1>
    <p class="role">Junior Programmer · Web &amp; Mobile</p>
  </div>


  <div class="pile" aria-hidden="true">
    <span class="label" style="left: 0; bottom: 0; transform: rotate(-4deg)">Laravel</span>
    <span class="orb" style="left: 168px; bottom: 6px; transform: rotate(6deg)">&lt;/&gt;</span>
    <span class="label" style="left: 22px; bottom: 66px; transform: rotate(3deg)">React.js</span>
    <span class="label" style="left: 120px; bottom: 132px; transform: rotate(-6deg)">Flutter</span>
    <span class="label" style="left: 0; bottom: 196px; transform: rotate(5deg)">MikroTik</span>
    <span class="orb" style="left: 196px; bottom: 236px; transform: rotate(-3deg)">*</span>
  </div>
</body>
</html>
